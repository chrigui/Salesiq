name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          # prisma generate (part of `build`) only needs a syntactically
          # valid connection string, not a reachable database — no service
          # container needed for this job.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"

  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salesiq
          POSTGRES_PASSWORD: salesiq
          POSTGRES_DB: salesiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          TEST_DATABASE_URL: "postgresql://salesiq:salesiq@localhost:5432/salesiq_test?schema=public"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-only-secret-not-for-production-0000' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
